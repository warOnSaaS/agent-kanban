# Who is on the team and what they can see. Everyone signs in with GitHub.
#   github:  their GitHub username. Sign-in is matched on this.
#   email:   optional. If github is missing, the first sign-in from a GitHub account
#            with this verified email links them and fills in github automatically.
#   role:    owner sees everything (and gets the repo itself); team sees the clients listed.
#   clients: all, or a list of client folder names.

people:
